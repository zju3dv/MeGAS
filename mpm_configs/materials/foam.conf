# Liquid (molten) phase: viscoplastic foam with Herschel-Bulkley plastic flow.
# Explicitly given moduli (mu, lam, bulk) take precedence; missing ones are derived from (E, nu).
materials {
    E = 28000       # Young's modulus
    nu = 0.4        # Poisson's ratio
    mu = 10000      # shear modulus; a large value is required to prevent the shape from collapsing
    lam = 40000     # first Lame parameter
    bulk = 100      # bulk modulus

    # Herschel-Bulkley plasticity
    shear_ratio = 1.0       # flow exponent h; larger values give stronger shear thinning
    viscosity = 10          # viscosity coefficient
    yield_threshold = 1     # yield stress

    # Heat diffusion and phase change, read from the liquid material
    heat_diff_ratio = 0.0001        # thermal diffusivity k / (rho * c)
    thermal_phase_threshold = 0.7   # melting temperature (normalized)

    elastic_method = stvk  # stvk | herschel
}
