# Sticky planar walls of the simulation domain [0, 1]^3; normals point into the domain.
collision {
    planes {
        plane_1 { # ground
            point = [0.5, 0.5, 0.1]
            normal = [0.0, 0.0, 1.0]
            type = sticky
        }

        plane_2 { # left
            point = [0.5, 0.0, 0.5]
            normal = [0.0, 1.0, 0.0]
            type = sticky
        }

        plane_3 { # front
            point = [1.0, 0.5, 0.5]
            normal = [-1.0, 0.0, 0.0]
            type = sticky
        }

        plane_4 { # right
            point = [0.5, 1.0, 0.5]
            normal = [0.0, -1.0, 0.0]
            type = sticky
        }

        plane_5 { # back
            point = [0.0, 0.5, 0.5]
            normal = [1.0, 0.0, 0.0]
            type = sticky
        }
    }
}
