# Solid phase: softer jelly with stronger gravity.
# Explicitly given moduli (mu, bulk) take precedence; lam is derived from (E, nu).
materials {
    E = 2000        # Young's modulus
    nu = 0.2        # Poisson's ratio
    mu = 10000      # shear modulus
    bulk = 100      # bulk modulus

    # Global settings, read from the solid material only
    gravity = 4.0
    density = 100.0

    elastic_method = stvk  # stvk | herschel
}
