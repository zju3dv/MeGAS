# 在指定时间内，逐渐对位于特定空间内的粒子施加重力
collision {
    sequential_cube {
        dir = z # 方向 x,y,z
        start_position = 0.3 # 起点
        end_position = 0.1 # 终点
        num_layers = 50
        start_step = 0
        end_step = 500
        material_type = foam # 从上到下逐渐切换为foam
    }


    planes {
        plane_1 {
            point = [0.5, 0.5, 0.1]
            normal = [0.0, 0.0, 1.0]
            type = sticky
        }

        plane_2 { # left
            point = [0.5, 0.0, 0.5]
            normal = [0.0, 1.0, 0.0]
            type = sticky
        }

        plane_3 { # front
            point = [1.0, 0.5, 0.5]
            normal = [-1.0, 0.0, 0.0]
            type = sticky
        }

        plane_4 { # right
            point = [0.5, 1.0, 0.5]
            normal = [0.0, -1.0, 0.0]
            type = sticky
        }

        plane_5 { # back
            point = [0.0, 0.5, 0.5]
            normal = [1.0, 0.0, 0.0]
            type = sticky
        }
    }

}